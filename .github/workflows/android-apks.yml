name: SwoopTV Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/icons/**'
      - 'apple-touch-icon.png'
      - '.github/workflows/android-apks.yml'
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: phone
            task: assemblePhoneRelease
          - flavor: tv
            task: assembleTvRelease
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "Android API 35 not preinstalled"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "Android build-tools 35.0.0 not preinstalled"; exit 1; }
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify environment
        run: |
          java -version
          gradle --version
          test -f android/settings.gradle
          test -f android/app/build.gradle
      - name: Configure permanent release signing
        env:
          SWOOP_KEYSTORE_BASE64: ${{ secrets.SWOOP_KEYSTORE_BASE64 }}
          SWOOP_KEYSTORE_PASSWORD: ${{ secrets.SWOOP_KEYSTORE_PASSWORD }}
          SWOOP_KEY_ALIAS: ${{ secrets.SWOOP_KEY_ALIAS }}
          SWOOP_KEY_PASSWORD: ${{ secrets.SWOOP_KEY_PASSWORD }}
        run: |
          test -n "$SWOOP_KEYSTORE_BASE64" && test -n "$SWOOP_KEYSTORE_PASSWORD" && test -n "$SWOOP_KEY_ALIAS" && test -n "$SWOOP_KEY_PASSWORD" || { echo "::error::Set all four permanent Android signing secrets before publishing updater APKs"; exit 1; }
          echo "$SWOOP_KEYSTORE_BASE64" | base64 --decode > android/swooptv-release.jks
          echo "SWOOP_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/swooptv-release.jks" >> "$GITHUB_ENV"
          echo "SWOOP_KEYSTORE_PASSWORD=$SWOOP_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SWOOP_KEY_ALIAS=$SWOOP_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SWOOP_KEY_PASSWORD=$SWOOP_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.flavor }} APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --stacktrace --no-daemon --console=plain :app:${{ matrix.task }} 2>&1 | tee ../android-build-${{ matrix.flavor }}.log
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swooptv-${{ matrix.flavor }}-build-log
          path: android-build-${{ matrix.flavor }}.log
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swooptv-${{ matrix.flavor }}-release-apk
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error

  publish:
    name: Publish stable Downloader links
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository for version metadata
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: swooptv-phone-release-apk
          path: phone
      - uses: actions/download-artifact@v4
        with:
          name: swooptv-tv-release-apk
          path: tv
      - name: Prepare stable APK filenames
        run: |
          cp phone/*.apk SwoopTV-Phone.apk
          cp tv/*.apk SwoopTV-AndroidTV.apk
      - name: Validate both installable APKs before publishing
        run: |
          set -euo pipefail
          for apk in SwoopTV-Phone.apk SwoopTV-AndroidTV.apk; do
            test -s "$apk"
            unzip -t "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -3
            ls -lh "$apk"
          done
      - name: Publish sole stable Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release upload android-latest SwoopTV-Phone.apk SwoopTV-AndroidTV.apk --clobber --repo "$GITHUB_REPOSITORY" || gh release create android-latest SwoopTV-Phone.apk SwoopTV-AndroidTV.apk --repo "$GITHUB_REPOSITORY" --title "SwoopTV Android" --notes "Signed Android phone and TV releases."
      - name: Verify public Downloader APK URLs deliver exact APK bytes
        run: |
          set -euo pipefail
          for apk in SwoopTV-AndroidTV.apk SwoopTV-Phone.apk; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/$apk"
            echo "Checking public URL: $url"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 180 --output "/tmp/$apk" "$url"
            test -s "/tmp/$apk"
            cmp "$apk" "/tmp/$apk" || { echo "::error::$apk public download differs from signed build"; exit 1; }
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "/tmp/$apk"
            echo "$apk: public download verified ($(wc -c < "/tmp/$apk") bytes)"
          done
      - name: Retire obsolete Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-test-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete android-test-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish update manifest
        run: |
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" android/app/build.gradle | head -1)
          test -n "$VERSION_CODE"
          cat > android-update.json <<JSON
          {
            "phone": {"versionCode": $VERSION_CODE, "url": "https://github.com/Swoop081/swoop-tv/releases/download/android-latest/SwoopTV-Phone.apk"},
            "tv": {"versionCode": $VERSION_CODE, "url": "https://github.com/Swoop081/swoop-tv/releases/download/android-latest/SwoopTV-AndroidTV.apk"}
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-update.json
          git commit -m "Publish Android update manifest [skip ci]" || exit 0
          git push
