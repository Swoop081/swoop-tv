name: Android test APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/icons/**'
      - 'apple-touch-icon.png'
      - '.github/workflows/android-apks.yml'
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: phone
            task: assemblePhoneDebug
          - flavor: tv
            task: assembleTvDebug
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "Android API 35 not preinstalled"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "Android build-tools 35.0.0 not preinstalled"; exit 1; }
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify environment
        run: |
          java -version
          gradle --version
          test -f android/settings.gradle
          test -f android/app/build.gradle
      - name: Build ${{ matrix.flavor }} APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --stacktrace --no-daemon --console=plain :app:${{ matrix.task }} 2>&1 | tee ../android-build-${{ matrix.flavor }}.log
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swooptv-${{ matrix.flavor }}-build-log
          path: android-build-${{ matrix.flavor }}.log
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swooptv-${{ matrix.flavor }}-debug-apk
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error

  publish:
    name: Publish stable Downloader links
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swooptv-phone-debug-apk
          path: phone
      - uses: actions/download-artifact@v4
        with:
          name: swooptv-tv-debug-apk
          path: tv
      - name: Prepare stable APK filenames
        run: |
          cp phone/*.apk SwoopTV-Phone.apk
          cp tv/*.apk SwoopTV-AndroidTV.apk
      - name: Publish latest testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-latest SwoopTV-Phone.apk SwoopTV-AndroidTV.apk --repo "$GITHUB_REPOSITORY" --title "SwoopTV Android testing" --notes "Early Android test builds. Debug signing may change between builds: reinstall may be necessary until persistent release signing is configured." --prerelease
