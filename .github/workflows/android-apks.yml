name: Android test APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apks.yml'
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: phone
            task: assemblePhoneDebug
          - flavor: tv
            task: assembleTvDebug
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify environment
        run: |
          java -version
          gradle --version
          test -f android/settings.gradle
          test -f android/app/build.gradle
      - name: Build ${{ matrix.flavor }} APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --stacktrace --no-daemon --console=plain :app:${{ matrix.task }} 2>&1 | tee ../android-build-${{ matrix.flavor }}.log
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swooptv-${{ matrix.flavor }}-build-log
          path: android-build-${{ matrix.flavor }}.log
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swooptv-${{ matrix.flavor }}-debug-apk
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error
