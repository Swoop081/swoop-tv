name: Android test APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apks.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [phone, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assemble${{ matrix.flavor == 'phone' && 'Phone' || 'Tv' }}Debug
      - uses: actions/upload-artifact@v4
        with:
          name: swooptv-${{ matrix.flavor }}-debug-apk
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error
