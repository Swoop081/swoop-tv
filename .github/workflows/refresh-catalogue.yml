name: Refresh SwoopTV catalogue
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: swooptv-catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh provider availability and dynamic collections
        env:
          SWOOP_XTREAM_URL: ${{ secrets.SWOOP_XTREAM_URL }}
          SWOOP_XTREAM_USER: ${{ secrets.SWOOP_XTREAM_USER }}
          SWOOP_XTREAM_PASSWORD: ${{ secrets.SWOOP_XTREAM_PASSWORD }}
          SWOOP_MDBLIST_API_KEY: ${{ secrets.SWOOP_MDBLIST_API_KEY }}
          SWOOP_TMDB_READ_TOKEN: ${{ secrets.SWOOP_TMDB_READ_TOKEN }}
        run: python3 scripts/refresh_catalogue.py
      - name: Publish refreshed catalogue safely
        env:
          SWOOP_XTREAM_URL: ${{ secrets.SWOOP_XTREAM_URL }}
          SWOOP_XTREAM_USER: ${{ secrets.SWOOP_XTREAM_USER }}
          SWOOP_XTREAM_PASSWORD: ${{ secrets.SWOOP_XTREAM_PASSWORD }}
          SWOOP_MDBLIST_API_KEY: ${{ secrets.SWOOP_MDBLIST_API_KEY }}
          SWOOP_TMDB_READ_TOKEN: ${{ secrets.SWOOP_TMDB_READ_TOKEN }}
        run: |
          git config user.name "swooptv-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never rebase a generated JSON snapshot onto a concurrently edited JSON.
          # Recompute against the latest main whenever it advances.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/refresh_catalogue.py
            git add swooptv-curated.json
            if git diff --cached --quiet; then
              echo "Catalogue is already up to date."
              exit 0
            fi
            git commit -m "Refresh provider catalogue and dynamic collections"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced while publishing; regenerate from latest main ($attempt/5)."
            sleep 3
          done
          echo "::error::Could not publish after five fresh attempts."
          exit 1
