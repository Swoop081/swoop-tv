plugins { id 'com.android.application' }
android {
    namespace 'tv.swoop.app'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'tv.swoop.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }
    flavorDimensions 'device'
    productFlavors {
        phone { dimension 'device'; applicationIdSuffix '.phone'; resValue 'string', 'app_name', 'SwoopTV' }
        tv { dimension 'device'; applicationIdSuffix '.tv'; resValue 'string', 'app_name', 'SwoopTV' }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('SWOOP_KEYSTORE_PATH') ?: 'missing-release-keystore.jks')
            storePassword System.getenv('SWOOP_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('SWOOP_KEY_ALIAS') ?: ''
            keyPassword System.getenv('SWOOP_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'androidx.media3:media3-exoplayer:1.5.1'; implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'; implementation 'androidx.media3:media3-ui:1.5.1' }
