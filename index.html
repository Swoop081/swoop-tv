<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c101a"><title>SwoopTV · Preview</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2fb;background:#0c101a;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,.tile:focus-visible{outline:3px solid #f9bb54;outline-offset:2px}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #222a3a;position:sticky;top:0;background:#0c101af5;z-index:5}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand b{color:#f5b44c}nav{display:flex;gap:7px}nav button,.pill,.action{border:0;background:#1d2738;border-radius:12px;padding:11px 16px}nav button.active,.pill.active{background:#e7a941;color:#131723;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:22px 24px 110px}.hero{border-radius:22px;padding:34px;min-height:230px;background:radial-gradient(circle at 80% 30%,#684335 0,transparent 44%),linear-gradient(115deg,#27364f,#101725);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:13px}.eyebrow{font-size:12px;letter-spacing:2px;color:#f3bc64;font-weight:800}.hero h1{margin:0;font-size:clamp(26px,4vw,48px)}.muted{color:#9eacc2}.action{background:#e7a941;color:#121827;font-weight:800}h2{font-size:19px;margin:27px 0 14px}.rail{display:flex;gap:13px;overflow-x:auto;padding-bottom:10px}.tile{border:1px solid #344055;background:#1a2536;border-radius:15px;padding:18px;min-width:190px;min-height:116px;text-align:left}.tile strong{display:block;margin:10px 0 4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.epgtop{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-bottom:18px}.details,.preview{background:#1a2536;border-radius:18px;padding:20px;min-height:180px}.preview{background:#03060b;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;aspect-ratio:16/9}.preview video{width:100%;height:100%;object-fit:contain}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar select,.toolbar input{background:#1d2738;border:1px solid #344055;border-radius:10px;color:white;padding:11px;min-width:150px}.guide{overflow:auto;border:1px solid #29364b;border-radius:14px;max-height:510px;position:relative}.epggrid{min-width:940px}.epgrow{display:grid;grid-template-columns:200px repeat(4,minmax(180px,1fr));min-height:63px;border-bottom:1px solid #101725}.epgrow>div,.epgrow>button{padding:12px;border:0;border-right:1px solid #111827;text-align:left;background:#222d40}.epgrow>.channel{position:sticky;left:0;z-index:2;background:#172133;font-weight:800}.epgrow.heading{position:sticky;top:0;z-index:3;min-height:40px}.epgrow.heading>div{background:#344258;font-size:13px}.epgrow button.current{background:#3b3c41}.epgrow button.selected{outline:2px solid #f5b44c;outline-offset:-2px}.progress{height:4px;background:#536073;border-radius:4px;margin-top:10px;overflow:hidden}.progress span{display:block;background:#f3b64f;height:100%}.categorylist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.categorylist button{border:1px solid #344055;border-radius:12px;padding:17px;text-align:left;background:#1c2637}.status{font-size:12px;color:#aab7ca}.panel{background:#192435;padding:22px;border-radius:16px;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.poster{background:linear-gradient(135deg,#334764,#20283a);min-height:210px;border-radius:12px;display:flex;align-items:end;padding:16px;font-weight:700}.toggle{display:flex;gap:12px;align-items:center;margin:12px 0}.toggle input{accent-color:#e7a941}.bottom{display:none}.small{font-size:13px}body.fullscreen .preview{position:fixed;inset:0;z-index:20;border-radius:0;aspect-ratio:auto}body.fullscreen .preview button{position:absolute;top:20px;right:20px} @media(max-width:780px){header{height:60px;padding:0 16px}header nav{display:none}.wrap{padding:14px 14px 100px}.hero{min-height:200px;padding:24px}.epgtop{grid-template-columns:1fr 42%;gap:8px}.details,.preview{min-height:150px;padding:12px}.details h2{font-size:17px}.preview{aspect-ratio:auto}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#151e2df5;padding:10px 4px max(13px,env(safe-area-inset-bottom));z-index:10;border-top:1px solid #344055}.bottom button{border:0;background:none;color:#c5d0e0;font-size:12px;padding:7px}.bottom button.active{color:#f3b64f}.epgrow{grid-template-columns:145px repeat(4,190px)}.toolbar select{min-width:110px}.tile{min-width:160px}} </style></head>
<body><header><div class="brand">Swoop<b>TV</b> <span class="status">v0.1</span></div><nav id="topnav"></nav><span class="status">INTERACTIVE DEMO</span></header><main class="wrap" id="app"></main><div class="bottom" id="bottomnav"></div>
<script>
const groups={"🟢 Kayo Sports 🟢":["Kayo Main Event","Kayo Cricket","Kayo Football","Kayo Racing","Kayo Sports 05","Kayo Sports 06","Kayo Sports 07","Kayo Sports 08"],"🔴 Premium Entertainment 🔴":["HBO","HBO West","HBO 2","HBO Signature","HBO Zone","HBO Comedy","Star Wars","Game of Thrones","Harry Potter","Lord of the Rings"],"🌎 World Sports 🌎":["NBA 01","NBA 02","NBA 03","NBA 04","NBA 05","NBA 06","NBA 07","NBA 08"],"🎟️ (PPV) Live Sport Today 🎟️":["PPV EVENT 01","PPV EVENT 02","PPV EVENT 03"],"🟠 Sitcoms 🟠":["Seinfeld","Friends","The Office","Parks and Recreation"],"🔵 Teen & Adult Animation 🔵":["The Simpsons","South Park","Family Guy","Rick and Morty","Bob's Burgers","Futurama","American Dad","King of the Hill","BoJack Horseman","Archer"],"🎵 Music Videos 🎵":["Pop Hits","Rock Classics","Music 80s"]};
const movieNames=["Trending Movies","Popular on Netflix","IMDb Top Rated","New Releases","Action Essentials","Award Winners"],seriesNames=["Trending Series","Popular on Netflix","Top Rated Series","New Episodes","Comedy Favourites","Drama Essentials"];
const pages=["Home","Live TV","Movies","Series","Sports","STARmeter","Settings"];let page="Home",category="🔴 Premium Entertainment 🔴",playing=localStorage.getItem("swoop-playing")||"HBO",focused=playing,selectedSlot=0,previewError=false,offset=0,showCategories=false;
const app=document.getElementById("app");function el(s){return document.createElement("div")}function nav(){for(const id of ["topnav","bottomnav"]){document.getElementById(id).innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" data-page="'+p+'">'+p+'</button>').join("")}}function setPage(p){page=p;render();scrollTo(0,0)}function setChannel(c){playing=c;focused=c;localStorage.setItem("swoop-playing",c);previewError=false;render()}function programs(c){if(c==="HBO")return ["The Housemaid","Upcoming Feature","Late Movie","Overnight"];if(c==="HBO 2")return ["Youth","The Revenant","Next Film","Overnight"];if(c==="HBO Signature")return ["Weapons","Next Feature","Late Feature","Overnight"];if(c==="HBO Comedy")return ["Barbie","Comedy Feature","Late Film","Overnight"];if(c.includes("NBA"))return ["Provider schedule","Provider schedule","Provider schedule","Provider schedule"];return [c,c,c,c]}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function home(){return '<div class="hero"><div class="eyebrow">FEATURED · SWOOPTV</div><h1>Everything worth watching.</h1><div>Movies, series and live events — together in one place.</div><button class="action" data-page="Live TV">Open Live TV Guide →</button></div>'+section("Continue Watching",["Last watched channel: "+playing,"Continue a series","Resume a movie"])+section("Live Now",["NBA Preseason","Sports Events","Live TV Guide"])+section("Trending Movies",movieNames)+section("Trending Series",seriesNames)+section("Upcoming Events",["NBA Preseason Calendar","Matchups & Streams"])}function section(name,items){return '<h2>'+name+'</h2><div class="rail">'+items.map(x=>'<button class="tile" data-target="'+escapeHTML(x)+'"><span class="eyebrow">SWOOPTV</span><strong>'+escapeHTML(x)+'</strong><span class="muted small">Demo content</span></button>').join("")+'</div>'}function live(){let channels=groups[category]||[];let time=new Date();time.setMinutes(Math.floor(time.getMinutes()/30)*30,0,0);let labels=Array.from({length:4},(_,i)=>new Date(time.getTime()+(i+offset)*1800000).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));return '<div class="sectionhead"><h2>Live TV</h2><span class="status">Sample EPG · No live stream connected</span></div><div class="epgtop"><div class="details"><div class="eyebrow">HIGHLIGHTED PROGRAMME</div><h2>'+escapeHTML(focused)+'</h2><p class="muted">'+escapeHTML(programs(focused)[Math.max(0,selectedSlot%4)])+'</p><p class="status">Playing: '+escapeHTML(playing)+'</p><button class="pill" id="tune">▶ Tune selected channel</button></div><div class="preview"><div style="font-size:35px">▣</div><strong>'+escapeHTML(playing)+'</strong><span class="status">Preview requires playlist connection</span><button class="pill" id="expand">⛶ Full screen</button></div></div><div class="toolbar"><button class="pill '+(showCategories?'active':'')+'" id="categories">☰ Categories</button><select id="group">'+Object.keys(groups).map(g=>'<option '+(g===category?'selected':'')+' value="'+escapeHTML(g)+'">'+escapeHTML(g)+'</option>').join("")+'</select><button class="pill" id="backtime">← Earlier</button><button class="pill" id="now">Now</button><button class="pill" id="nexttime">Later →</button></div>'+(showCategories?'<div class="categorylist">'+Object.keys(groups).map(g=>'<button data-group="'+escapeHTML(g)+'">'+escapeHTML(g)+' →</button>').join("")+'</div>':'<div class="guide"><div class="epggrid"><div class="epgrow heading"><div class="channel">CHANNEL</div>'+labels.map(t=>'<div>'+t+'</div>').join("")+'</div>'+channels.map((c,i)=>'<div class="epgrow"><div class="channel">'+escapeHTML(c)+'</div>'+programs(c).map((p,j)=>'<button class="'+(c===focused&&j===selectedSlot?'selected ':'')+(j===0?'current':'')+'" data-channel="'+escapeHTML(c)+'" data-slot="'+j+'"><span class="small muted">'+escapeHTML(c)+'</span><br><strong>'+escapeHTML(p)+'</strong>'+(j===0?'<div class="progress"><span style="width:42%"></span></div>':'')+'</button>').join("")+'</div>').join("")+'</div></div>')+'<p class="status">Browse programmes without changing playback. Select a programme, then Tune. Channel names and programme data are illustrative.</p>'}function catalog(kind){let arr=kind==="Movies"?movieNames:seriesNames;return '<h2>'+kind+'</h2><p class="muted">Curated collections update automatically in the connected version. Sample titles below.</p>'+arr.map(x=>section(x,kind==="Movies"?["Featured Film","New Arrival","Critically Acclaimed","Popular Pick"]:["Featured Series","New Episode","Trending Show","Popular Pick"])).join("")}function sports(){return '<h2>Sports · NBA Preseason</h2><p class="muted">Initial sports integration. Real fixtures and IPTV matching will be connected in v0.2.</p><div class="cards">'+["Cavaliers vs Magic","Bucks vs Hornets","Nuggets vs Bulls","Spurs vs Jazz","Warriors vs Lakers"].map(x=>'<button class="tile" data-target="'+x+'"><span class="eyebrow">NBA PRESEASON</span><strong>'+x+'</strong><span class="muted small">Demo matchup · Stream not linked</span></button>').join("")+'</div>'}function settings(){return '<h2>Settings</h2><div class="panel"><h3>Guide preferences</h3>'+["8 visible EPG rows","30-minute timeline","Autoplay last watched channel","Channel logos","Programme progress indicators","Provider categories"].map(x=>'<label class="toggle"><input type="checkbox" checked disabled> '+x+'</label>').join("")+'</div><div class="panel"><h3>My Sports</h3><p class="muted">Choose which sports appear in the event calendar.</p>'+["NBA","AFL","UFC","WWE","NFL","EPL"].map(x=>'<label class="toggle"><input type="checkbox" '+(localStorage.getItem("sport-"+x)!=="off"&&(x==="NBA"||x==="AFL")?'checked':'')+' data-sport="'+x+'"> '+x+'</label>').join("")+'</div><div class="panel"><h3>Playlists</h3><p class="muted">Xtream Codes and M3U integration is planned for v0.2. Never put IPTV credentials in a public repository.</p></div>'}function render(){nav();app.innerHTML=page==="Home"?home():page==="Live TV"?live():page==="Movies"||page==="Series"?catalog(page):page==="Sports"?sports():page==="STARmeter"?'<h2>STARmeter</h2><p class="muted">Top 100 people and matched available content will appear here after metadata integration.</p>':settings()}document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.page){setPage(b.dataset.page);return}if(b.dataset.group){category=b.dataset.group;showCategories=false;focused=(groups[category]||[])[0]||playing;selectedSlot=0;render();return}if(b.dataset.channel){focused=b.dataset.channel;selectedSlot=Number(b.dataset.slot);render();return}if(b.id==="tune"){setChannel(focused);return}if(b.id==="categories"){showCategories=!showCategories;render();return}if(b.id==="backtime"){offset-=2;render();return}if(b.id==="nexttime"){offset+=2;render();return}if(b.id==="now"){offset=0;render();return}if(b.id==="expand"){document.body.classList.toggle("fullscreen");b.textContent=document.body.classList.contains("fullscreen")?"✕ Close":"⛶ Full screen";return}if(b.dataset.target){let x=b.dataset.target;if(x.includes("NBA")||x.includes("Matchup"))setPage("Sports");else if(x.includes("Live")||x.includes("channel"))setPage("Live TV");else alert(x+" — sample collection; IPTV matching will be added in v0.2.")}});document.addEventListener("change",e=>{if(e.target.id==="group"){category=e.target.value;focused=(groups[category]||[])[0]||playing;selectedSlot=0;render()}if(e.target.dataset.sport)localStorage.setItem("sport-"+e.target.dataset.sport,e.target.checked?"on":"off")});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("fullscreen")){document.body.classList.remove("fullscreen");render()}});render();
</script></body></html>
