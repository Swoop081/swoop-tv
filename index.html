const pages=["Home","Live TV","Movies","Series","Sports","STARmeter","Settings"];let xtream={base:"",user:"",pass:"",channels:[],groups:[],accountInfo:null,vod:[],vodCats:[],series:[],seriesCats:[],status:"Not connected"},connected=false;const CATALOG_TTL=24*60*60*1000;let cacheBusy=false;function catalogKey(base,user){return base+"|"+user}function catalogDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open("swooptv-catalog",1);req.onupgradeneeded=()=>req.result.createObjectStore("catalog");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function catalogRead(key){const db=await catalogDB();return new Promise((resolve,reject)=>{const tx=db.transaction("catalog","readonly"),req=tx.objectStore("catalog").get(key);req.onsuccess=()=>{resolve(req.result||null);db.close()};req.onerror=()=>{reject(req.error);db.close()}})}async function catalogWrite(key,data){const db=await catalogDB();return new Promise((resolve,reject)=>{const tx=db.transaction("catalog","readwrite");tx.objectStore("catalog").put(data,key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}async function catalogDelete(key){const db=await catalogDB();return new Promise((resolve,reject)=>{const tx=db.transaction("catalog","readwrite");tx.objectStore("catalog").delete(key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}function catalogSnapshot(){return {groups:xtream.groups,channels:xtream.channels,vodCats:xtream.vodCats,vod:xtream.vod,seriesCats:xtream.seriesCats,series:xtream.series,accountInfo:xtream.accountInfo}}async function saveCatalog(key,time=Date.now()){try{await catalogWrite(key,{...catalogSnapshot(),updatedAt:time})}catch(e){console.warn("Catalogue cache unavailable",e)}}function showCachedCatalog(saved,base,user,pass){if(!saved||!Array.isArray(saved.channels)||!saved.channels.length||!Array.isArray(saved.groups))return false;xtream={base,user,pass,...catalogSnapshot(),...s ";vodMessage="Movies: "+xtream.vod.length+" · Series: "+xtream.series.length;if(page==="Settings"||page==="Movies"||page==="Series")render()}catch(e){xtream.status="Using saved catalogue · refresh failed: "+e.message;if(page==="Settings")render()}finally{cacheBusy=false}}function catalogStatus(){return "Playlist cache refreshes at most once every 24 hours; use Refresh now to check sooner."}
const SAVED_LOGIN_KEY="swooptv-saved-login-v1";function savedLogin(){try{return JSON.parse(localStorage.getItem(SAVED_LOGIN_KEY)||"null")}catch(e){return null}}function forgetLogin(){const key=catalogKey(xtream.base,xtream.user);catalogDelete(key).catch(()=>{});localStorage.removeItem(SAVED_LOGIN_KEY);connected=false;xtream={base:"",user:"",pass:"",channels:[],groups:[],accountInfo:null,vod:[],vodCats:[],series:[],seriesCats:[],status:"Not connected"};render()}let videoNode=null,videoChannelId=null;let page="Home",category="🔴 Premium Entertainment 🔴",playing="",focused=playing,selectedSlot=0,previewError=false,offset=0,showCategories=false;
const app=document.getElementById("app");function el(s){return document.createElement("div")}function nav(){if(!connected){document.getElementById("topnav").innerHTML="";document.getElementById("bottomnav").innerHTML="";return}for(const id of ["topnav","bottomnav"]){document.getElementById(id).innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" data-page="'+p+'">'+p+'</button>').join("")}}function setPage(p){if(!connected)return;if(page==="Live TV"&&p!=="Live TV"){destroyTsPlayer();activeStreamName="";videoChannelId=null}page=p;render();scrollTo(0,0)}function setChannel(c){playing=c;focused=c;try{localStorage.setItem("swoop-playing",c)}catch(e){};previewError=false;render();startStream(c)}function channelsInGroup(){return xtream.channels.filter(c=>category==="All Channels"||String(c.category_id)===category).slice(0,250).map(c=>c.name)}function findStream(name){return xtream.channels.find(c=>c.name===name)}

async function diagnosePlayback(){const c=findStream(focused);const out=document.getElementById("playdiag");if(!c||!out)return;const ai=xtream.accountInfo||{};const formats=Array.isArray(ai.allowedFormats)?ai.allowedFormats.join(", "):"Not advertised";const direct=typeof c.direct_source==="string"&&c.direct_source.trim();let directHost="";if(direct){try{const u=new URL(direct);directHost=u.protocol+"//"+u.hostname+(u.port?":"+u.port:"")}catch(e){directHost="Present (unparseable URL)"}}const header=["Provider-advertised formats: "+formats,"API streaming protocol: "+(ai.protocol||"Not advertised"),"API streaming hostname: "+(ai.host||"Not advertised"),"HTTPS streaming port: "+(ai.httpsPort||"Not advertised"),"Selected channel format: "+(c.container_extension||"Not advertised"),"Selected channel direct source: "+(direct?directHost:"Not supplied"),"Login host: "+new URL(xtream.base).hostname,"Note: advertised metadata does not prove browser playback.","","Checking HLS and MPEG-TS responses…"].join("\n");out.textContent=header;const checks=await Promise.all(["m3u8","ts"].map(async format=>{const url=streamUrl(c,format);try{const res=await fetch(url,{method:"GET",signal:AbortSignal.timeout(8000),cache:"no-store"});const type=res.headers.get("content-type")||"unknown";const finalProtocol=new URL(res.url).protocol;let detail="";if(format==="m3u8"&&res.ok&&/mpegurl|text\/plain|octet-stream/i.test(type)){const reader=res.body?.getReader();if(reader){const part=await reader.read();await reader.cancel();const sample=new TextDecoder().decode(part.value||new Uint8Array()).slice(0,200);detail=sample.trimStart().startsWith("#EXTM3U")?" · HLS header detected":" · No HLS header detected"}}return format.toUpperCase()+": HTTP "+res.status+" · "+type+" · "+finalProtocol+detail}catch(e){return format.toUpperCase()+": Browser cannot inspect response (CORS, redirect, network or timeout)"}}));out.textContent=header.replace("Checking HLS and MPEG-TS responses…","")+checks.join("\n")+"\nSafar async function testAuthenticatedRoutes(){const c=findStream(focused),out=document.getElementById("playdiag");if(!c||!out||!videoNode)return;const generation=++playbackGeneration;destroyTsPlayer();activeStreamName="";const results=["Authenticated API and Safari route test","Credentials and full URLs are hidden."];out.textContent=results.join("\n");const api=xtream.base+"/player_api.php?username="+encodeURIComponent(xtream.user)+"&password="+encodeURIComponent(xtream.pass)+"&action=get_live_streams";try{const response=await fetch(api,{cache:"no-store",signal:AbortSignal.timeout(12000)});if(!response.ok){results.push("Authenticated API: HTTP "+response.status)}else{const data=await response.json();results.push("Authenticated API: "+(Array.isArray(data)?"OK · "+data.length+" channels":"Unexpected response"))}}catch(e){results.push("Authenticated API: request blocked or timed out")}out.textContent=results.join("\n");if(generation!==playbackGeneration)return;const hosts=[new URL(xtream.base).host];const advertised=xtream.accountInfo?.host;if(advertised&&advertised!=="Not advertised"&&!hosts.includes(advertised))hosts.push(advertised);const urls=[];for(const host of hosts){const prefix="https://"+host;const creds=encodeURIComponent(xtream.user)+"/"+encodeURIComponent(xtream.pass)+"/"+encodeURIComponent(c.stream_id);urls.push({label:host+" /live/ .m3u8",url:prefix+"/live/"+creds+".m3u8"});urls.push({label:host+" /hls/ .m3u8",url:prefix+"/hls/"+creds+".m3u8"});urls.push({label:host+" /live/ .ts",url:prefix+"/live/"+creds+".ts"})}for(const candidate of urls){if(generation!==playbackGeneration)return;videoNode.pause();videoNode.removeAttribute("src");videoNode.load();const outcome=await new Promise(resolve=>{let done=false,timer;const finish=x=>{if(done)return;done=true;clearTimeout(timer);videoNode.removeEventListener("loadedmetadata",ok);videoNode.removeEventListener("playing",ok);videoNode.removeEventListener("error",fail);resolve(x)};const ok=()=>finish("media loaded");con start)/(p.end-p.start)))+'%;height:100%;background:#f5b44c"></div></div>':'')+'</button>'}).join("")+'</div>'}).join("")) .join("")+'</div></div>'}

===curatedGroup)).flatMap(g=>g.entries).filter(e=>!vodSearch||e.name.toLowerCase().includes(vodSearch.toLowerCase()));const entry=entries[Number(b.dataset.curatedvod)];if(!entry)return;const source=(entry.streams||[]).map(st=>{const found=(type==="movie"?xtream.vod:xtream.series).find(x=>String(type==="movie"?x.stream_id:x.series_id)===String(st.id));return found||{name:entry.name,stream_id:String(st.id),series_id:String(st.id),container_extension:st.ext||"mp4",curatedSource:true}}).find(x=>x.stream_id||x.series_id);curatedChoice=entry;vodSelected=source||{name:entry.name,stream_id:null,series_id:null};lastVodUrl="";if(type==="series"&&source)loadSeriesEpisodes(source);else{vodEpisodes=[];vodLoading=false;render()}return}if(b.id==="refreshcatalog"){refreshCatalog(true);return}if(b.id==="forgetlogin"){forgetLogin();return}if(b.dataset.page){vodSelected=null;curatedChoice=null;curatedGroup="all";vodSearch="";vodCategory="all";setPage(b.dataset.page);return}if(b.id==="vodback"){vodSelected=null;curatedChoice=null;render();return}if(b.dataset.vodid){const movies=page==="Movies";const item=(movies?xtream.vod:xtream.series).find(x=>String(movies?x.stream_id:x.series_id)===b.dataset.vodid);if(!item)return;if(movies){vodSelected=item;lastVodUrl="";render()}else{lastVodUrl="";loadSeriesEpisodes(item)};return}if(b.id==="vodplay"){playVod(vodUrl(vodSelected));return}if(b.id==="vodcopyselected"){if(!lastVodUrl){const el=document.getElementById("vodstatus");if(el)el.textContent="Select an episode first.";return}navigator.clipboard.writeText(lastVodUrl).then(()=>{const el=document.getElementById("vodstatus");if(el)el.textContent="Selected stream URL copied"}).catch(()=>window.prompt("Copy stream URL",lastVodUrl));return}if(b.id==="vodcopy"){const url=vodUrl(vodSelected);navigator.clipboard.writeText(url).then(()=>{document.getElementById("vodstatus").textContent="URL copied"}).catch(()=>window.prompt("Copy stream URL",url));return}if(b.dataset.episode){const list=vodEpisodes.filt
