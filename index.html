<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c101a"><title>SwoopTV · Preview</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2fb;background:#0c101a;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,.tile:focus-visible{outline:3px solid #f9bb54;outline-offset:2px}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #222a3a;position:sticky;top:0;background:#0c101af5;z-index:5}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand b{color:#f5b44c}nav{display:flex;gap:7px}nav button,.pill,.action{border:0;background:#1d2738;border-radius:12px;padding:11px 16px}nav button.active,.pill.active{background:#e7a941;color:#131723;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:22px 24px 110px}.hero{border-radius:22px;padding:34px;min-height:230px;background:radial-gradient(circle at 80% 30%,#684335 0,transparent 44%),linear-gradient(115deg,#27364f,#101725);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:13px}.eyebrow{font-size:12px;letter-spacing:2px;color:#f3bc64;font-weight:800}.hero h1{margin:0;font-size:clamp(26px,4vw,48px)}.muted{color:#9eacc2}.action{background:#e7a941;color:#121827;font-weight:800}h2{font-size:19px;margin:27px 0 14px}.rail{display:flex;gap:13px;overflow-x:auto;padding-bottom:10px}.tile{border:1px solid #344055;background:#1a2536;border-radius:15px;padding:18px;min-width:190px;min-height:116px;text-align:left}.tile strong{display:block;margin:10px 0 4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.epgtop{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-bottom:18px}.details,.preview{background:#1a2536;border-radius:18px;padding:20px;min-height:180px}.preview{background:#03060b;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;aspect-ratio:16/9}.preview video{width:100%;height:100%;object-fit:contain}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar select,.toolbar input{background:#1d2738;border:1px solid #344055;border-radius:10px;color:white;padding:11px;min-width:150px}.guide{overflow:auto;border:1px solid #29364b;border-radius:14px;max-height:510px;position:relative}.epggrid{min-width:940px}.epgrow{display:grid;grid-template-columns:200px repeat(4,minmax(180px,1fr));min-height:63px;border-bottom:1px solid #101725}.epgrow>div,.epgrow>button{padding:12px;border:0;border-right:1px solid #111827;text-align:left;background:#222d40}.epgrow>.channel{position:sticky;left:0;z-index:2;background:#172133;font-weight:800}.epgrow.heading{position:sticky;top:0;z-index:3;min-height:40px}.epgrow.heading>div{background:#344258;font-size:13px}.epgrow button.current{background:#3b3c41}.epgrow button.selected{outline:2px solid #f5b44c;outline-offset:-2px}.progress{height:4px;background:#536073;border-radius:4px;margin-top:10px;overflow:hidden}.progress span{display:block;background:#f3b64f;height:100%}.categorylist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.categorylist button{border:1px solid #344055;border-radius:12px;padding:17px;text-align:left;background:#1c2637}.status{font-size:12px;color:#aab7ca}.panel{background:#192435;padding:22px;border-radius:16px;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.poster{background:linear-gradient(135deg,#334764,#20283a);min-height:210px;border-radius:12px;display:flex;align-items:end;padding:16px;font-weight:700}.toggle{display:flex;gap:12px;align-items:center;margin:12px 0}.toggle input{accent-color:#e7a941}.bottom{display:none}.small{font-size:13px}body.fullscreen .preview{position:fixed;inset:0;z-index:20;border-radius:0;aspect-ratio:auto}body.fullscreen .preview button{position:absolute;top:20px;right:20px} @media(max-width:780px){header{height:60px;padding:0 16px}header nav{display:none}.wrap{padding:14px 14px 100px}.hero{min-height:200px;padding:24px}.epgtop{grid-template-columns:1fr 42%;gap:8px}.details,.preview{min-height:150px;padding:12px}.details h2{font-size:17px}.preview{aspect-ratio:auto}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#151e2df5;padding:10px 4px max(13px,env(safe-area-inset-bottom));z-index:10;border-top:1px solid #344055}.bottom button{border:0;background:none;color:#c5d0e0;font-size:12px;padding:7px}.bottom button.active{color:#f3b64f}.epgrow{grid-template-columns:145px repeat(4,190px)}.toolbar select{min-width:110px}.tile{min-width:160px}} </style></head>
<body><header><div class="brand">Swoop<b>TV</b> <span class="status">v0.4.2</span></div><nav id="topnav"></nav><span class="status">INTERACTIVE DEMO</span></header><main class="wrap" id="app"><div style="max-width:440px;margin:8vh auto;padding:26px;background:#192435;border-radius:22px"><h2>Connect your TV service</h2><p class="muted">Enter your Xtream Codes login details.</p><form id="xtreamform"><p><input required id="server" type="url" placeholder="Server URL" style="width:100%;padding:12px"></p><p><input required id="username" placeholder="Username" style="width:100%;padding:12px"></p><p><input required id="password" type="password" placeholder="Password" style="width:100%;padding:12px"></p><button class="action" type="submit">Connect</button></form><p id="connectionstatus" role="status"></p></div></main><div class="bottom" id="bottomnav"></div>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script>
const groups={"🟢 Kayo Sports 🟢":["Kayo Main Event","Kayo Cricket","Kayo Football","Kayo Racing","Kayo Sports 05","Kayo Sports 06","Kayo Sports 07","Kayo Sports 08"],"🔴 Premium Entertainment 🔴":["HBO","HBO West","HBO 2","HBO Signature","HBO Zone","HBO Comedy","Star Wars","Game of Thrones","Harry Potter","Lord of the Rings"],"🌎 World Sports 🌎":["NBA 01","NBA 02","NBA 03","NBA 04","NBA 05","NBA 06","NBA 07","NBA 08"],"🎟️ (PPV) Live Sport Today 🎟️":["PPV EVENT 01","PPV EVENT 02","PPV EVENT 03"],"🟠 Sitcoms 🟠":["Seinfeld","Friends","The Office","Parks and Recreation"],"🔵 Teen & Adult Animation 🔵":["The Simpsons","South Park","Family Guy","Rick and Morty","Bob's Burgers","Futurama","American Dad","King of the Hill","BoJack Horseman","Archer"],"🎵 Music Videos 🎵":["Pop Hits","Rock Classics","Music 80s"]};
const movieNames=["Trending Movies","Popular on Netflix","IMDb Top Rated","New Releases","Action Essentials","Award Winners"],seriesNames=["Trending Series","Popular on Netflix","Top Rated Series","New Episodes","Comedy Favourites","Drama Essentials"];
const pages=["Home","Live TV","Movies","Series","Sports","STARmeter","Settings"];let xtream={base:"",user:"",pass:"",channels:[],groups:[],status:"Not connected"},connected=false;let videoNode=null,videoChannelId=null;let page="Home",category="🔴 Premium Entertainment 🔴",playing="",focused=playing,selectedSlot=0,previewError=false,offset=0,showCategories=false;
const app=document.getElementById("app");function el(s){return document.createElement("div")}function nav(){if(!connected){document.getElementById("topnav").innerHTML="";document.getElementById("bottomnav").innerHTML="";return}for(const id of ["topnav","bottomnav"]){document.getElementById(id).innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" data-page="'+p+'">'+p+'</button>').join("")}}function setPage(p){if(!connected)return;if(page==="Live TV"&&p!=="Live TV"){destroyTsPlayer();activeStreamName="";videoChannelId=null}page=p;render();scrollTo(0,0)}function setChannel(c){playing=c;focused=c;try{localStorage.setItem("swoop-playing",c)}catch(e){};previewError=false;render();startStream(c)}function channelsInGroup(){return xtream.channels.filter(c=>category==="All Channels"||String(c.category_id)===category).slice(0,250).map(c=>c.name)}function findStream(name){return xtream.channels.find(c=>c.name===name)}
let activeStreamName="",activeFormat="mpegts",tsPlayer=null,playbackGeneration=0;
function streamUrl(c,format){return xtream.base+"/live/"+encodeURIComponent(xtream.user)+"/"+encodeURIComponent(xtream.pass)+"/"+encodeURIComponent(c.stream_id)+"."+format}
function streamMessage(msg){const st=document.getElementById("videostatus");if(st)st.textContent=msg}
function destroyTsPlayer(){if(!tsPlayer)return;try{tsPlayer.pause();tsPlayer.unload();tsPlayer.detachMediaElement();tsPlayer.destroy()}catch(e){console.warn("MPEG-TS cleanup",e)}tsPlayer=null}
function startStream(name){const c=findStream(name);if(!c||!videoNode)return;activeStreamName=name;videoChannelId=c.stream_id;const generation=++playbackGeneration;destroyTsPlayer();videoNode.pause();videoNode.removeAttribute("src");videoNode.load();if(videoNode.canPlayType("application/vnd.apple.mpegurl")){activeFormat="hls";streamMessage("Connecting to HLS stream…");videoNode.src=streamUrl(c,"m3u8");videoNode.onerror=async()=>{if(generation!==playbackGeneration)return;const code=videoNode.error?.code||"unknown";streamMessage("HLS failed (media error "+code+"). Checking stream response…");try{const res=await fetch(streamUrl(c,"m3u8"),{signal:AbortSignal.timeout(10000),cache:"no-store"});if(generation!==playbackGeneration)return;const type=res.headers.get("content-type")||"unknown";const protocol=new URL(res.url).protocol;let detail="";if(res.ok&&/mpegurl|text\/plain|octet-stream/i.test(type)){const body=(await res.text()).slice(0,1000);detail=body.trimStart().startsWith("#EXTM3U")?"Valid HLS playlist header":"Response is not an HLS playlist"}streamMessage("HLS diagnostic: HTTP "+res.status+" · "+type+" · "+protocol+" · "+(detail||"Media error "+code)+".")}catch(e){if(generation===playbackGeneration)streamMessage("HLS media error "+code+"; browser could not inspect stream (CORS, blocked redirect, network or server rejection).")}};videoNode.onloadedmetadata=()=>{if(generation===playbackGeneration)streamMessage("HLS stream loaded · Tap play if needed")};videoNode.load();const p=videoNode.play();if(p&&p.catch)p.catch(e=>{if(generation===playbackGeneration)streamMessage(e.name==="NotAllowedError"?"HLS ready · Tap play to start":"HLS playback failed: "+e.message)});return}if(!window.mpegts){streamMessage("MPEG-TS player library did not load. Check network access or content blockers.");return}if(!mpegts.getFeatureList().mseLivePlayback){streamMessage("This browser does not support MPEG-TS MediaSource live playback.");return}activeFormat="mpegts";streamMessage("Connecting to MPEG-TS stream…");try{tsPlayer=mpegts.createPlayer({type:"mpegts",isLive:true,url:streamUrl(c,"ts")},{enableWorker:false,enableStashBuffer:false,autoCleanupSourceBuffer:true,lazyLoad:false});tsPlayer.attachMediaElement(videoNode);tsPlayer.on(mpegts.Events.ERROR,(type,detail,info)=>{if(generation!==playbackGeneration)return;const extra=info&&typeof info==="object"?(info.code?" (HTTP "+info.code+")":info.msg?" ("+String(info.msg).slice(0,120)+")":""):"";streamMessage("MPEG-TS error: "+type+" / "+detail+extra+". Check stream access, CORS and codec support.")});tsPlayer.on(mpegts.Events.MEDIA_INFO,info=>{if(generation!==playbackGeneration)return;const v=info.videoCodec||"unknown",a=info.audioCodec||"unknown";streamMessage("Stream detected · Video: "+v+" · Audio: "+a)});tsPlayer.load();const p=tsPlayer.play();if(p&&p.catch)p.catch(e=>{if(generation!==playbackGeneration)return;streamMessage(e.name==="NotAllowedError"?"Tap the video play button to start playback":"Playback failed: "+e.message)})}catch(e){streamMessage("Could not start MPEG-TS player: "+e.message)}}
function attachPlayer(){if(!connected||page!=="Live TV")return;const host=document.getElementById("videohost");if(!host)return;if(!videoNode){videoNode=document.createElement("video");videoNode.id="livevideo";videoNode.controls=true;videoNode.playsInline=true;videoNode.setAttribute("playsinline","");videoNode.preload="none";videoNode.style.cssText="width:100%;height:100%;max-height:220px;background:#000;border-radius:10px";videoNode.addEventListener("playing",()=>streamMessage("Live · MPEG-TS"));videoNode.addEventListener("error",()=>{if(activeStreamName)streamMessage("Video decoder error. The stream codec may be unsupported in Safari.")})}host.appendChild(videoNode)}
function programs(c){return ["No EPG data","No EPG data","No EPG data","No EPG data"]}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function home(){return '<div class="hero"><div class="eyebrow">FEATURED · SWOOPTV</div><h1>Everything worth watching.</h1><div>Movies, series and live events — together in one place.</div><button class="action" data-page="Live TV">Open Live TV Guide →</button></div>'+section("Continue Watching",["Last watched channel: "+playing])+section("Live TV",["Live TV Guide"])}function section(name,items){return '<h2>'+name+'</h2><div class="rail">'+items.map(x=>'<button class="tile" data-target="'+escapeHTML(x)+'"><span class="eyebrow">SWOOPTV</span><strong>'+escapeHTML(x)+'</strong><span class="muted small">Demo content</span></button>').join("")+'</div>'}function live(){let channels=channelsInGroup();let time=new Date();time.setMinutes(Math.floor(time.getMinutes()/30)*30,0,0);let labels=Array.from({length:4},(_,i)=>new Date(time.getTime()+(i+offset)*1800000).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));return '<div class="sectionhead"><h2>Live TV</h2><span class="status">EPG pending · Imported provider channels</span></div><div class="epgtop"><div class="details"><div class="eyebrow">HIGHLIGHTED PROGRAMME</div><h2>'+escapeHTML(focused)+'</h2><p class="muted">'+escapeHTML(programs(focused)[Math.max(0,selectedSlot%4)])+'</p><p class="status">Playing: '+escapeHTML(playing)+'</p><button class="pill" id="tune">▶ Tune selected channel</button></div><div class="preview"><div id="videohost" style="width:100%"></div><span class="status" id="videostatus">Select Tune to start playback</span><button class="pill" id="expand">⛶ Full screen</button></div></div><div class="toolbar"><button class="pill '+(showCategories?'active':'')+'" id="categories">☰ Categories</button><select id="group">'+xtream.groups.map(g=>String(g.category_id)).map(g=>'<option '+(g===category?'selected':'')+' value="'+escapeHTML(g)+'">'+escapeHTML(xtream.groups.find(x=>String(x.category_id)===g)?.category_name||g)+'</option>').join("")+'</select><button class="pill" id="backtime">← Earlier</button><button class="pill" id="now">Now</button><button class="pill" id="nexttime">Later →</button></div>'+(showCategories?'<div class="categorylist">'+xtream.groups.map(x=>String(x.category_id)).map(g=>'<button data-group="'+escapeHTML(g)+'">'+escapeHTML(xtream.groups.find(x=>String(x.category_id)===g)?.category_name||g)+' →</button>').join("")+'</div>':'<div class="guide"><div class="epggrid"><div class="epgrow heading"><div class="channel">CHANNEL</div>'+labels.map(t=>'<div>'+t+'</div>').join("")+'</div>'+channels.map((c,i)=>'<div class="epgrow"><div class="channel">'+escapeHTML(c)+'</div>'+programs(c).map((p,j)=>'<button class="'+(c===focused&&j===selectedSlot?'selected ':'')+(j===0?'current':'')+'" data-channel="'+escapeHTML(c)+'" data-slot="'+j+'"><span class="small muted">'+escapeHTML(c)+'</span><br><strong>'+escapeHTML(p)+'</strong>'+(j===0?'<div class="progress"><span style="width:42%"></span></div>':'')+'</button>').join("")+'</div>').join("")+'</div></div>')+'<p class="status">Browse programmes without changing playback. Select a programme, then Tune. Channels are imported from your provider; EPG import is pending.</p>'}function catalog(kind){let arr=kind==="Movies"?movieNames:seriesNames;return '<h2>'+kind+'</h2><p class="muted">No '+kind.toLowerCase()+' imported yet. Provider catalogue integration is coming next.</p>'}function sports(){return '<h2>Sports</h2><p class="muted">Sports schedule integration is coming next. No sample events are shown.</p>'}function settings(){return '<h2>Settings</h2><div class="panel"><h3>Xtream Codes connection</h3><p class="muted small">Enter credentials only in the app. Password stays in this browser tab memory and is never committed to GitHub. Browser CORS or mixed-content restrictions may prevent connection.</p><form id="xtreamform"><p><input required id="server" type="url" placeholder="https://provider.example:port" style="width:100%;padding:12px;background:#111827;color:white;border:1px solid #40516a;border-radius:9px"></p><p><input required id="username" autocomplete="username" placeholder="Username" style="width:100%;padding:12px;background:#111827;color:white;border:1px solid #40516a;border-radius:9px"></p><p><input required id="password" type="password" autocomplete="off" placeholder="Password" style="width:100%;padding:12px;background:#111827;color:white;border:1px solid #40516a;border-radius:9px"></p><button class="action" type="submit">Connect & import Live TV</button></form><p id="connectionstatus" class="muted small">'+escapeHTML(xtream.status)+'</p></div><div class="panel"><h3>Guide preferences</h3>'+["8 visible EPG rows","30-minute timeline","Autoplay last watched channel","Channel logos","Programme progress indicators","Provider categories"].map(x=>'<label class="toggle"><input type="checkbox" checked disabled> '+x+'</label>').join("")+'</div><div class="panel"><h3>My Sports</h3><p class="muted">Choose which sports appear in the event calendar.</p>'+["NBA","AFL","UFC","WWE","NFL","EPL"].map(x=>'<label class="toggle"><input type="checkbox" '+(localStorage.getItem("sport-"+x)!=="off"&&(x==="NBA"||x==="AFL")?'checked':'')+' data-sport="'+x+'"> '+x+'</label>').join("")+'</div><div class="panel"><h3>Playlists</h3><p class="muted">Xtream Codes and M3U integration is planned for v0.2. Never put IPTV credentials in a public repository.</p></div>'}function login(){return '<div style="max-width:440px;margin:8vh auto;padding:26px;background:#192435;border-radius:22px"><div class="brand" style="font-size:38px;margin-bottom:16px">Swoop<b>TV</b></div><h2>Connect your TV service</h2><p class="muted">Enter the login details supplied by your TV provider to get started.</p>'+"<form id=\"xtreamform\"><p><input required id=\"server\" type=\"url\" placeholder=\"https://provider.example:port\" style=\"width:100%;padding:12px;background:#111827;color:white;border:1px solid #40516a;border-radius:9px\"></p><p><input required id=\"username\" autocomplete=\"username\" placeholder=\"Username\" style=\"width:100%;padding:12px;background:#111827;color:white;border:1px solid #40516a;border-radius:9px\"></p><p><input required id=\"password\" type=\"password\" autocomplete=\"off\" placeholder=\"Password\" style=\"width:100%;padding:12px;background:#111827;color:white;border:1px solid #40516a;border-radius:9px\"></p><button class=\"action\" type=\"submit\">Connect & import Live TV</button></form>"+'<p id="connectionstatus" class="muted small" role="status"></p><p class="muted small">Your details are used to connect directly to your provider. They are not added to GitHub. Browser restrictions may prevent some services from connecting.</p></div>'}function render(){if(videoNode&&videoNode.parentNode)videoNode.remove();nav();if(!connected){app.innerHTML=login();return}app.innerHTML=page==="Home"?home():page==="Live TV"?live():page==="Movies"||page==="Series"?catalog(page):page==="Sports"?sports():page==="STARmeter"?'<h2>STARmeter</h2><p class="muted">Top 100 people and matched available content will appear here after metadata integration.</p>':settings();attachPlayer()}document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(!connected)return;if(b.dataset.page){setPage(b.dataset.page);return}if(b.dataset.group){category=b.dataset.group;showCategories=false;focused=channelsInGroup()[0]||playing;selectedSlot=0;render();return}if(b.dataset.channel){focused=b.dataset.channel;selectedSlot=Number(b.dataset.slot);render();return}if(b.id==="tune"){setChannel(focused);return}if(b.id==="categories"){showCategories=!showCategories;render();return}if(b.id==="backtime"){offset-=2;render();return}if(b.id==="nexttime"){offset+=2;render();return}if(b.id==="now"){offset=0;render();return}if(b.id==="expand"){if(videoNode&&videoNode.requestFullscreen){videoNode.requestFullscreen().catch(()=>document.body.classList.toggle("fullscreen"))}else document.body.classList.toggle("fullscreen");b.textContent=document.body.classList.contains("fullscreen")?"✕ Close":"⛶ Full screen";return}if(b.dataset.target){let x=b.dataset.target;if(x.includes("NBA")||x.includes("Matchup"))setPage("Sports");else if(x.includes("Live")||x.includes("channel"))setPage("Live TV");else alert(x+" — sample collection; IPTV matching will be added in v0.2.")}});document.addEventListener("submit",async e=>{if(e.target.id!=="xtreamform")return;e.preventDefault();const base=document.getElementById("server").value.trim().replace(/[/]+$/,"");const user=document.getElementById("username").value.trim(),pass=document.getElementById("password").value;const status=document.getElementById("connectionstatus");status.textContent="Connecting to Xtream provider…";try{const url=(action)=>base+"/player_api.php?username="+encodeURIComponent(user)+"&password="+encodeURIComponent(pass)+(action?"&action="+action:"");const load=async action=>{const res=await fetch(url(action),{signal:AbortSignal.timeout(15000)});if(!res.ok)throw Error("HTTP "+res.status);return res.json()};const account=await load("");if(String(account.user_info?.auth)!=="1")throw Error("Account authentication failed");const [cats,streams]=await Promise.all([load("get_live_categories"),load("get_live_streams")]);if(!Array.isArray(cats)||!Array.isArray(streams))throw Error("Invalid category or stream response");if(!cats.length||!streams.length)throw Error("Your provider returned no live channels or categories");xtream={base,user,pass,groups:cats,channels:streams,status:"Connected: "+streams.length+" channels, "+cats.length+" categories"};connected=true;category=String(cats[0].category_id);playing=streams[0].name;focused=channelsInGroup()[0]||playing;page="Home";render();}catch(err){xtream.status="Connection failed: "+err.message;status.textContent=xtream.status+" (check CORS, HTTPS and provider access)";}});document.addEventListener("change",e=>{if(e.target.id==="group"){category=e.target.value;focused=channelsInGroup()[0]||playing;selectedSlot=0;render()}if(e.target.dataset.sport)localStorage.setItem("sport-"+e.target.dataset.sport,e.target.checked?"on":"off")});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("fullscreen")){document.body.classList.remove("fullscreen");render()}});try{render()}catch(error){document.getElementById("app").insertAdjacentHTML("afterbegin",'<p role="alert" style="padding:14px;color:#ffc36c">Startup issue: '+String(error.message).replace(/[<>]/g,"")+'</p>');console.error(error)}
</script></body></html>
